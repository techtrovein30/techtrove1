server {
    listen 80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html index.htm;

    # ── Security headers ─────────────────────────────────────────────────────
    # Prevent MIME sniffing: browsers won't guess content types from headers.
    add_header X-Content-Type-Options "nosniff" always;
    # Prevent clickjacking (the page cannot be embedded in a rogue iframe).
    add_header X-Frame-Options "DENY" always;
    # Limit referrer info to same-origin (payment screenshots, registration
    # codes, etc. must never leak via Referer to external sites).
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Feature policy: disable camera/mic/geolocation in this SPA.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS: always send Secure cookies over HTTPS. Prevents downgrade
    # (strip-S) on initial load.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP: only self-hosted scripts/styles; Google Fonts are the only external
    # load; Supabase REST/realtime/storage are the only remote connections.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # SPA: any path serves the SPA shell; Vite routes are client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets: immutable cache (built hashes never change).
    # add_header is NOT inherited from the server block once a location
    # defines its own, so repeat every security header here.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
        access_log off;
    }
}